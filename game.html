<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보 게임 - RPS WORLD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4316129795865181"
     crossorigin="anonymous"></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">RPS WORLD</a>
            <nav class="main-nav">
                <a href="index.html">홈</a>
                <a href="game.html">게임하기</a>
                <a href="index.html#articles">블로그</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="game-container">
            <h1>가위바위보 게임</h1>
            <div class="choices">
                <button id="rock" data-choice="바위">바위</button>
                <button id="scissors" data-choice="가위">가위</button>
                <button id="paper" data-choice="보">보</button>
            </div>
            <div id="countdown" class="message"></div>
            <div class="result-display">
                <div class="player-display">
                    <p>나:</p>
                    <span id="player-choice" class="choice-emoji"></span>
                </div>
                <div class="computer-display">
                    <p>AI:</p>
                    <span id="computer-choice" class="choice-emoji"></span>
                </div>
            </div>
            <div id="result-message" class="message">결과</div>
            <button id="reset-button">다시하기</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 RPS WORLD. 모든 권리 보유.</p>
            <p><a href="#">About</a> | <a href="#">Contact</a> | <a href="#">Privacy Policy</a></p>
        </div>
    </footer>
    <script src="game.js"></script>
</body>
</html>
