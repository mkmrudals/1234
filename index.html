<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>가위바위보 게임</h1>
        <div class="choices">
            <button id="rock" data-choice="바위">바위</button>
            <button id="scissors" data-choice="가위">가위</button>
            <button id="paper" data-choice="보">보</button>
        </div>
        <div id="countdown" class="message"></div>
        <div class="result-display">
            <div class="player-display">
                <p>나:</p>
                <div id="player-choice-img" class="choice-img"></div>
            </div>
            <div class="computer-display">
                <p>AI:</p>
                <div id="computer-choice-img" class="choice-img"></div>
            </div>
        </div>
        <div id="result-message" class="message">결과</div>
        <button id="reset-button">다시하기</button>
    </div>
    <script src="main.js"></script>
</body>
</html>
