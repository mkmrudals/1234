<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저녁 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"></div>
        </label>
    </div>
    <div class="container">
        <h1>저녁 메뉴 추천</h1>
        <button id="generate-btn">메뉴 추천</button>
        <div id="numbers-container"></div>

        <hr style="margin: 40px 0; border-color: #eee;">

        <h2>제휴 문의</h2>
        <form action="https://formspree.io/forms/mgokogkz/integration" method="POST" class="contact-form">
            <!-- IMPORTANT: Replace YOUR_FORMSPREE_ENDPOINT with your actual Formspree endpoint -->
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">문의 내용:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">문의 제출</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
